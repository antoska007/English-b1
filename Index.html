<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --blue: #2f6fed;
    --blue-light: #eef4ff;
    --green: #2fae55;
    --green-light: #d8f5dd;
    --red: #e05252;
    --red-light: #fde0e0;
    --gray-bg: #f1f3f7;
    --gray-text: #6b7280;
    --dark: #1a1a1a;
    --border: #e5e7eb;
  }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fff;
    color: var(--dark);
    font-size: 16px;
    line-height: 1.45;
    overscroll-behavior: none;
  }
  body { padding-bottom: 70px; }

  /* Шапка */
  header {
    position: sticky; top: 0; z-index: 100;
    background: var(--blue); color: #fff;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
  }
  header .back {
    background: transparent; border: 0; color: #fff;
    font-size: 22px; cursor: pointer; padding: 0 6px;
    display: none;
  }
  header .back.show { display: block; }
  header h1 { font-size: 18px; font-weight: 600; flex: 1; }

  /* Нижнее меню */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    background: #fff;
    border-top: 1px solid var(--border);
    display: grid; grid-template-columns: repeat(5, 1fr);
    padding: 6px 0 max(6px, env(safe-area-inset-bottom));
  }
  nav button {
    background: transparent; border: 0; padding: 6px 2px;
    font-size: 10px; color: var(--gray-text);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    cursor: pointer; font-family: inherit;
  }
  nav button .ico { font-size: 20px; }
  nav button.active { color: var(--blue); font-weight: 600; }

  /* Экраны */
  .screen { display: none; padding: 16px; animation: fadeIn .18s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* Карточки */
  .card {
    background: var(--gray-bg);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card.tap { cursor: pointer; transition: transform .1s; }
  .card.tap:active { transform: scale(.98); }
  .card-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .card-title { font-size: 16px; font-weight: 600; }
  .card-desc { font-size: 13px; color: var(--gray-text); margin-top: 4px; }

  .section-title {
    font-size: 17px; font-weight: 700;
    margin: 18px 0 10px;
  }
  .section-title:first-child { margin-top: 0; }

  /* Прогресс-бар */
  .bar-bg {
    height: 6px; background: var(--border); border-radius: 3px;
    overflow: hidden; margin-top: 8px;
  }
  .bar-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width .3s; }

  /* Кнопки */
  .btn {
    display: block; width: 100%;
    background: var(--blue); color: #fff;
    border: 0; border-radius: 12px;
    padding: 15px; font-size: 16px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    margin-top: 12px;
    transition: transform .1s;
  }
  .btn:active { transform: scale(.98); }
  .btn.secondary { background: var(--gray-text); }
  .btn.ghost { background: transparent; color: var(--blue); border: 2px solid var(--blue); }
  .btn.green { background: var(--green); }
  .btn.red { background: var(--red); }
  .btn:disabled { background: #c7cdd6; cursor: not-allowed; }

  .btn-row { display: flex; gap: 10px; margin-top: 12px; }
  .btn-row .btn { margin-top: 0; flex: 1; }

  /* Варианты ответа */
  .option {
    background: var(--gray-bg);
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: all .15s;
  }
  .option:active { transform: scale(.99); }
  .option.correct { background: var(--green-light); border-color: var(--green); }
  .option.wrong { background: var(--red-light); border-color: var(--red); }

  /* Карточка слова */
  .word-card {
    background: var(--gray-bg);
    border-radius: 16px;
    padding: 24px 18px;
    text-align: center;
    min-height: 180px;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    margin-bottom: 14px;
  }
  .word-en { font-size: 32px; font-weight: 700; word-break: break-word; }
  .word-ru { font-size: 20px; margin-top: 14px; }
  .word-ex {
    font-size: 14px; color: var(--gray-text);
    margin-top: 10px; font-style: italic;
    line-height: 1.5;
  }
  .speak-btn {
    background: transparent; border: 0;
    color: var(--blue); font-size: 15px;
    margin-top: 10px; cursor: pointer; font-family: inherit;
  }

  /* Хедер статистики */
  .stats-header {
    background: var(--blue-light);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 16px;
  }
  .stats-header .streak { font-size: 16px; font-weight: 700; color: var(--blue); }
  .stats-header .summary { font-size: 13px; color: #4b5563; margin-top: 4px; }

  /* Ряд статистики */
  .stat-row {
    display: flex; justify-content: space-between;
    padding: 5px 0;
    font-size: 14px;
  }
  .stat-row .label { color: #4b5563; }
  .stat-row .value { font-weight: 700; }

  /* Текст для чтения */
  .reading-text {
    font-size: 16px; line-height: 1.55;
    white-space: pre-wrap; margin-bottom: 14px;
  }
  .badge {
    display: inline-block;
    font-size: 12px; color: var(--gray-text);
    margin-bottom: 8px;
  }

  /* Вкладки */
  .tabs {
    display: flex; background: var(--gray-bg);
    border-radius: 12px; padding: 4px;
    margin-bottom: 16px;
  }
  .tabs button {
    flex: 1; padding: 10px; border: 0;
    background: transparent; border-radius: 10px;
    font-size: 14px; font-weight: 600; color: var(--gray-text);
    cursor: pointer; font-family: inherit;
  }
  .tabs button.active { background: #fff; color: var(--blue); }

  /* Таймер */
  .timer-row {
    display: flex; justify-content: space-between;
    font-size: 13px; color: var(--gray-text);
    margin-bottom: 6px;
  }
  .timer-row .timer { color: var(--blue); font-weight: 700; font-size: 14px; }
  .timer-row .timer.warn { color: var(--red); }

  /* Разбор ответов */
  .review-row {
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 10px;
  }
  .review-row .icon { font-size: 18px; }
  .review-word { font-size: 15px; font-weight: 600; }
  .review-tr { font-size: 13px; color: var(--gray-text); }

  /* Оценка */
  .grade {
    font-size: 44px; font-weight: 800;
    margin: 6px 0 10px;
    text-align: center;
  }
  .grade-label { font-size: 16px; text-align: center; margin-bottom: 16px; }

  /* Скорость аудио */
  .speed-row {
    display: flex; gap: 6px; align-items: center;
    margin-bottom: 14px; flex-wrap: wrap;
  }
  .speed-row .lbl { font-size: 13px; color: var(--gray-text); }
  .speed-btn {
    padding: 6px 12px; border-radius: 8px;
    background: var(--gray-bg); border: 0;
    font-size: 13px; color: #4b5563;
    cursor: pointer; font-family: inherit;
  }
  .speed-btn.active { background: var(--blue); color: #fff; font-weight: 600; }

  /* Пропуск в грамматике */
  .blank { color: var(--blue); font-weight: 700; }

  /* Утилиты */
  .center { text-align: center; padding: 30px 16px; }
  .mt-0 { margin-top: 0; }
  .hidden { display: none !important; }
  .muted { color: var(--gray-text); font-size: 13px; }
  .explain { color: #4b5563; font-style: italic; font-size: 14px; margin-top: 6px; }

  /* Splash */
  #splash {
    position: fixed; inset: 0; z-index: 999;
    background: var(--blue); color: #fff;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
    transition: opacity .4s;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splash .big { font-size: 60px; }
  #splash .name { font-size: 22px; font-weight: 700; }
  #splash .sub { font-size: 14px; opacity: .9; }
</style>
